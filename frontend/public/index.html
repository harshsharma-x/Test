<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Zepto — 10-Minute Grocery & Essentials</title>
  <link rel="icon" href="https://cdn.zeptonow.com/production/web-static-assets-prod/artifacts/18.2.6/images/favicon.ico" />
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              800: '#3730a3',
              900: '#1e1b4b',
            },
            violet: {
              DEFAULT: '#8b5cf6',
              dark: '#6d28d9',
            },
            emerald: {
              DEFAULT: '#10b981',
              dark: '#059669',
            }
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- React 18, ReactDOM, and Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Telegram Mini App SDK (provides signed initData) -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Custom Design Tokens -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased selection:bg-brand-500 selection:text-white">
  <div id="root">
    <div class="min-h-screen flex items-center justify-center">
      <div class="animate-spin rounded-full h-12 w-12 border-4 border-indigo-600 border-t-transparent"></div>
    </div>
  </div>

  <!-- Main Application Script -->
  <script type="text/babel" src="app.js"></script>
</body>
</html>
