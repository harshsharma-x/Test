version: "3.8"

services:
  # Centralized FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql://zepto_user:zepto_password@postgres:5432/zepto_db
      - SECRET_KEY=zepto-production-secret-key-at-least-32-chars-long!
      - BOT_TOKEN=${BOT_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

  # Telegram Shopping Bot (aiogram 3.x)
  telegram_bot:
    build:
      context: .
      dockerfile: Dockerfile
    command: python telegram_bot/main.py
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql://zepto_user:zepto_password@postgres:5432/zepto_db
      - SECRET_KEY=zepto-production-secret-key-at-least-32-chars-long!
      - BOT_TOKEN=${BOT_TOKEN}
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  # Production PostgreSQL 16 Database
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zepto_user
      POSTGRES_PASSWORD: zepto_password
      POSTGRES_DB: zepto_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zepto_user -d zepto_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  # Nginx Gateway & Static Asset Caching
  nginx:
    image: nginx:alpine
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
